version: 2
ethernets:
  private:
    match:
      macaddress: "${private_mac}"
    set-name: ens3
    dhcp4: false
    addresses:
      - ${private_ipv4}/24
    routes:
      - to: default
        via: ${private_gateway_ipv4}
    nameservers:
      addresses: ${jsonencode(dns_servers)}
      search:
        - ${search_domain}
  netstack:
    match:
      macaddress: "${netstack_mac}"
    set-name: ens4
    dhcp4: false
    addresses:
      - ${netstack_ipv4}/24
